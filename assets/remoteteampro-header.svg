<svg xmlns="http://www.w3.org/2000/svg" width="900" height="160" viewBox="0 0 900 160" role="img">
  <title>RemoteTeamPro</title>
  <desc>RemoteTeamPro terminal logo with animated purple light sweep</desc>

  <defs>
    <!-- Import Manrope from Google Fonts (works when opened in a browser) -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@800&amp;display=swap');
    </style>

    <!-- Purple terminal light sweep gradient -->
    <linearGradient id="sweep" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="500" y2="0">
      <stop offset="0%"   stop-color="#7C3AED"/>
      <stop offset="35%"  stop-color="#7C3AED"/>
      <stop offset="45%"  stop-color="#A78BFA"/>
      <stop offset="50%"  stop-color="#FFFFFF"/>
      <stop offset="55%"  stop-color="#C4B5FD"/>
      <stop offset="65%"  stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <!-- Mask: only show the sweep over the text itself -->
    <mask id="textMask" maskUnits="userSpaceOnUse" x="0" y="0" width="900" height="160">
      <rect x="0" y="0" width="900" height="160" fill="black"/>
      <text x="450" y="95"
            font-family="Manrope, 'Segoe UI', Arial, sans-serif"
            font-size="64" font-weight="800" letter-spacing="2"
            text-anchor="middle" fill="white">RemoteTeamPro</text>
    </mask>
  </defs>

  <!-- Base text -->
  <text x="450" y="95"
        font-family="Manrope, 'Segoe UI', Arial, sans-serif"
        font-size="64" font-weight="800" letter-spacing="2"
        text-anchor="middle" fill="#A78BFA">RemoteTeamPro</text>

  <!-- Animated purple light pass -->
  <g mask="url(#textMask)">
    <rect x="-500" y="0" width="500" height="160" fill="url(#sweep)">
      <animate attributeName="x" from="-500" to="900" dur="4.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Terminal underscore cursor (blinking) -->
  <rect x="810" y="105" width="28" height="8" fill="#A78BFA">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
