<svg xmlns="http://www.w3.org/2000/svg"
     width="1800"
     height="300"
     viewBox="0 0 1800 300">

  <defs>

    <!-- Moving purple ambient light -->
    <linearGradient id="purpleLight"
      gradientUnits="userSpaceOnUse"
      x1="-600" y1="0"
      x2="-100" y2="0">

      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="38%"  stop-color="#ffffff"/>
      <stop offset="48%"  stop-color="#9b4dff"/>
      <stop offset="50%"  stop-color="#e5c2ff"/>
      <stop offset="52%"  stop-color="#9b4dff"/>
      <stop offset="62%"  stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffffff"/>

      <animate
        attributeName="x1"
        values="-700;1800;-700"
        dur="12s"
        repeatCount="indefinite"/>

      <animate
        attributeName="x2"
        values="-200;2300;-200"
        dur="12s"
        repeatCount="indefinite"/>
    </linearGradient>


    <!-- Very subtle purple glow -->
    <filter id="ambientGlow"
      x="-20%"
      y="-100%"
      width="140%"
      height="300%">

      <feGaussianBlur stdDeviation="4"/>
    </filter>

  </defs>


  <!-- =========================================
       SOFT PURPLE GLOW
       ========================================= -->

  <g transform="translate(900 0)"
     text-anchor="middle"
     opacity="0.45"
     filter="url(#ambientGlow)">

    <text
      x="0"
      y="66"
      xml:space="preserve"
      font-family="DejaVu Sans Mono, Consolas, 'Courier New', monospace"
      font-size="20"
      font-weight="400"
      letter-spacing="0"
      word-spacing="0"
      font-variant-ligatures="none"
      fill="url(#purpleLight)">

      <tspan x="0" dy="0"> mmmmmm                                                      mmmmmmmm                                mmmmmm                       </tspan>
      <tspan x="0" dy="24"> ##""""##                                  ##                """##"""                                ##""""#m                     </tspan>
      <tspan x="0" dy="24"> ##    ##   m####m   ####m##m   m####m   #######    m####m      ##      m####m    m#####m  ####m##m  ##    ##   ##m####   m####m  </tspan>
      <tspan x="0" dy="24"> #######   ##mmmm##  ## ## ##  ##"  "##    ##      ##mmmm##     ##     ##mmmm##   " mmm##  ## ## ##  ######"    ##"      ##"  "## </tspan>
      <tspan x="0" dy="24"> ##  "##m  ##""""""  ## ## ##  ##    ##    ##      ##""""""     ##     ##""""""  m##"""##  ## ## ##  ##         ##       ##    ## </tspan>
      <tspan x="0" dy="24"> ##    ##  "##mmmm#  ## ## ##  "##mm##"    ##mmm   "##mmmm#     ##     "##mmmm#  ##mmm###  ## ## ##  ##         ##       "##mm##" </tspan>
      <tspan x="0" dy="24"> ""    """   """""   "" "" ""    """"       """"     """""      ""       """""    """" ""  "" "" ""  ""         ""         """"   </tspan>

    </text>
  </g>


  <!-- =========================================
       CRISP MAIN ASCII TEXT
       ========================================= -->

  <g transform="translate(900 0)"
     text-anchor="middle">

    <text
      x="0"
      y="66"
      xml:space="preserve"
      font-family="DejaVu Sans Mono, Consolas, 'Courier New', monospace"
      font-size="20"
      font-weight="400"
      letter-spacing="0"
      word-spacing="0"
      font-variant-ligatures="none"
      fill="url(#purpleLight)">

      <tspan x="0" dy="0"> mmmmmm                                                      mmmmmmmm                                mmmmmm                       </tspan>
      <tspan x="0" dy="24"> ##""""##                                  ##                """##"""                                ##""""#m                     </tspan>
      <tspan x="0" dy="24"> ##    ##   m####m   ####m##m   m####m   #######    m####m      ##      m####m    m#####m  ####m##m  ##    ##   ##m####   m####m  </tspan>
      <tspan x="0" dy="24"> #######   ##mmmm##  ## ## ##  ##"  "##    ##      ##mmmm##     ##     ##mmmm##   " mmm##  ## ## ##  ######"    ##"      ##"  "## </tspan>
      <tspan x="0" dy="24"> ##  "##m  ##""""""  ## ## ##  ##    ##    ##      ##""""""     ##     ##""""""  m##"""##  ## ## ##  ##         ##       ##    ## </tspan>
      <tspan x="0" dy="24"> ##    ##  "##mmmm#  ## ## ##  "##mm##"    ##mmm   "##mmmm#     ##     "##mmmm#  ##mmm###  ## ## ##  ##         ##       "##mm##" </tspan>
      <tspan x="0" dy="24"> ""    """   """""   "" "" ""    """"       """"     """""      ""       """""    """" ""  "" "" ""  ""         ""         """"   </tspan>

    </text>

  </g>

</svg>
